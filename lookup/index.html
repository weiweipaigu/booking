<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>查詢我的報名｜瑋瑋老師的撒野記事錄</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="canonical" href="https://booking.weiweipaigu.com/lookup/" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --bg:#f7f5ef;
      --card:#fff;
      --text:#2f3a33;
      --muted:#66756b;
      --line:#dfe6df;
      --accent:#5d7a67;
      --accent-soft:#e8efe8;
      --danger:#a65353;
      --danger-soft:#f8eaea;
      --success:#3f6d4b;
      --success-soft:#e8f2ea;
      --neutral-soft:#f2f4f2;
      --max:820px;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:"Segoe UI","Noto Sans TC",sans-serif;
      background:var(--bg);
      color:var(--text);
      line-height:1.7;
    }

    a{color:inherit;text-decoration:none}
    button,input{font:inherit}
    .wrap{width:min(92%,var(--max));margin:0 auto}

    .nav{
      position:sticky;
      top:0;
      z-index:20;
      background:rgba(247,245,239,.94);
      backdrop-filter:blur(8px);
      border-bottom:1px solid var(--line);
    }

    .nav-inner{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:14px 0;
      gap:18px;
    }

    .brand{
      font-weight:700;
      letter-spacing:.02em;
      white-space:nowrap;
      flex-shrink:0;
    }

    .menu{
      display:flex;
      align-items:center;
      gap:18px;
      flex-wrap:nowrap;
      white-space:nowrap;
      font-size:.95rem;
      color:var(--muted);
    }

    .menu a:hover{color:var(--accent)}

    .hero{padding:48px 0 22px}

    .hero-box{
      background:linear-gradient(135deg,#eef4ee,#fbfaf6);
      border:1px solid var(--line);
      border-radius:28px;
      padding:32px 28px;
    }

    h1,h2,h3{line-height:1.3;margin:0 0 12px}
    h1{font-size:clamp(2rem,5vw,2.8rem)}
    p{margin:0 0 12px}
    .lead{color:var(--muted)}

    .section{padding:8px 0 24px}

    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:22px;
      padding:24px;
      box-shadow:0 10px 28px rgba(0,0,0,.04);
    }

    form{
      display:grid;
      gap:16px;
    }

    .field{
      display:grid;
      gap:6px;
    }

    label{font-weight:650}

    input{
      width:100%;
      padding:12px 14px;
      border:1px solid var(--line);
      border-radius:12px;
      background:#fff;
      color:var(--text);
    }

    input:focus{
      outline:none;
      border-color:var(--accent);
      box-shadow:0 0 0 3px var(--accent-soft);
    }

    .hint{
      color:var(--muted);
      font-size:.86rem;
    }

    .btn{
      width:fit-content;
      border:1px solid var(--accent);
      border-radius:999px;
      padding:11px 18px;
      background:var(--accent);
      color:#fff;
      font-weight:750;
      cursor:pointer;
    }

    .btn:disabled{
      opacity:.55;
      cursor:not-allowed;
    }

    .btn.secondary{
      background:transparent;
      color:var(--accent);
    }

    .message{
      display:none;
      margin-top:16px;
      padding:12px 14px;
      border-radius:14px;
    }

    .message.error{
      display:block;
      background:var(--danger-soft);
      color:var(--danger);
    }

    .result-card{
      display:none;
      margin-top:18px;
      padding-top:20px;
      border-top:1px solid var(--line);
    }

    .result-card.show{display:block}

    .status-badge{
      display:inline-flex;
      align-items:center;
      gap:7px;
      padding:6px 10px;
      border-radius:999px;
      background:var(--success-soft);
      color:var(--success);
      font-size:.86rem;
      font-weight:750;
      margin-bottom:14px;
    }

    .status-badge.cancelled{
      background:var(--danger-soft);
      color:var(--danger);
    }

    .status-badge.pending{
      background:#fff5d9;
      color:#8a6a1f;
    }

    .status-badge.waitlisted{
      background:#f4efe2;
      color:#7a6236;
    }

    .lookup-status-note{
      margin:12px 0 18px;
      padding:12px 14px;
      border:1px solid var(--line);
      border-radius:14px;
      background:#fbfbf8;
      color:var(--muted);
      white-space:pre-line;
    }

    .lookup-status-note a{
      color:var(--accent);
      font-weight:800;
      text-decoration:underline;
      text-underline-offset:3px;
    }

    .info-grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:12px;
      margin:16px 0;
    }

    .info-item{
      background:#fbfbf8;
      border:1px solid var(--line);
      border-radius:14px;
      padding:13px;
      min-width:0;
    }

    .info-label{
      color:var(--muted);
      font-size:.8rem;
      font-weight:700;
      margin-bottom:2px;
    }

    .info-value{
      font-weight:650;
      overflow-wrap:anywhere;
    }

    .reference-value{
      font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      font-size:.9rem;
    }

    .subsection{
      margin-top:18px;
    }

    .participant-list{
      display:grid;
      gap:8px;
      margin-top:8px;
    }

    .participant{
      padding:10px 12px;
      background:var(--neutral-soft);
      border-radius:12px;
    }

    .note-box{
      white-space:pre-wrap;
      padding:12px 14px;
      background:#fbfbf8;
      border:1px solid var(--line);
      border-radius:14px;
      color:#465148;
    }

    .actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:18px;
    }

    footer{
      padding:20px 0 48px;
      color:var(--muted);
      font-size:.92rem;
    }

    .footer-inner{
      display:flex;
      justify-content:space-between;
      gap:18px;
      flex-wrap:wrap;
    }

    .footer-links{
      display:flex;
      gap:14px;
      flex-wrap:wrap;
    }

    .footer-links a{
      text-decoration:underline;
      text-underline-offset:3px;
    }

    @media(max-width:700px){
      .nav-inner{
        display:block;
        padding:10px 0 8px;
      }

      .brand{
        display:block;
        font-size:.96rem;
        margin-bottom:6px;
      }

      .menu{
        width:100%;
        gap:18px;
        overflow-x:auto;
        padding-bottom:2px;
        font-size:.88rem;
        scrollbar-width:none;
        -webkit-overflow-scrolling:touch;
      }

      .menu::-webkit-scrollbar{display:none}

      .hero{padding:30px 0 20px}
      .hero-box,.card{padding:20px}
      .info-grid{grid-template-columns:1fr}

      .actions{
        display:grid;
      }

      .actions .btn{
        width:100%;
        text-align:center;
      }

      .footer-inner{display:grid}
    }
  </style>
</head>

<body>
  <nav class="nav">
    <div class="wrap nav-inner">
      <div class="brand">瑋瑋老師的撒野記事錄</div>
      <div class="menu" aria-label="主選單">
        <a href="https://www.weiweipaigu.com">Home</a>
        <a href="https://calendar.weiweipaigu.com">Calendar</a>
        <a href="https://shopping.weiweipaigu.com">Shopping</a>
        <a href="https://about.weiweipaigu.com">About</a>
      </div>
    </div>
  </nav>

  <header class="hero">
    <div class="wrap">
      <div class="hero-box">
        <h1>查詢我的報名</h1>
        <p class="lead">輸入報名成功時取得的報名編號，以及當時填寫的 E-mail，即可查看目前的報名內容與狀態。</p>
      </div>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="wrap">
        <article class="card">
          <form id="lookupForm">
            <div class="field">
              <label for="reference">報名編號</label>
              <input
                id="reference"
                type="text"
                required
                autocomplete="off"
                spellcheck="false"
                placeholder="例如：xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
              >
              <div class="hint">請輸入確認信或報名成功頁面上的完整報名編號。</div>
            </div>

            <div class="field">
              <label for="email">報名 E-mail</label>
              <input
                id="email"
                type="email"
                required
                autocomplete="email"
                placeholder="請輸入報名時使用的 E-mail"
              >
            </div>

            <button id="lookupButton" class="btn" type="submit">查詢報名</button>
          </form>

          <div id="message" class="message"></div>

          <section id="resultCard" class="result-card" aria-live="polite">
            <div id="statusBadge" class="status-badge"></div>
            <div id="statusNote" class="lookup-status-note"></div>

            <h2 id="eventTitle"></h2>

            <div class="info-grid">
              <div class="info-item">
                <div class="info-label">活動日期</div>
                <div id="eventDate" class="info-value"></div>
              </div>

              <div class="info-item">
                <div class="info-label">活動時間</div>
                <div id="eventTime" class="info-value"></div>
              </div>

              <div class="info-item">
                <div class="info-label">活動地點</div>
                <div id="eventLocation" class="info-value"></div>
              </div>

              <div class="info-item">
                <div class="info-label">報名人數</div>
                <div id="quantity" class="info-value"></div>
              </div>

              <div class="info-item">
                <div class="info-label">聯絡人</div>
                <div id="contactName" class="info-value"></div>
              </div>

              <div class="info-item">
                <div class="info-label">報名編號</div>
                <div id="publicReference" class="info-value reference-value"></div>
              </div>
            </div>

            <section class="subsection">
              <h3>參加者</h3>
              <div id="participants" class="participant-list"></div>
            </section>

            <section id="noteSection" class="subsection" hidden>
              <h3>備註／其他需求</h3>
              <div id="note" class="note-box"></div>
            </section>

            <div class="actions">
              <button id="searchAgainButton" class="btn secondary" type="button">重新查詢</button>
              <a class="btn secondary" href="https://calendar.weiweipaigu.com">回活動行事曆</a>
            </div>
          </section>
        </article>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap footer-inner">
      <div>© 2026 瑋瑋老師的撒野記事錄 · Booking Lookup</div>
      <div class="footer-links">
        <a href="https://privacy.weiweipaigu.com">隱私權政策</a>
        <a href="https://terms.weiweipaigu.com">服務條款</a>
      </div>
    </div>
  </footer>

  <script>
    const SUPABASE_URL = "https://aexhjnpskprtvpqbxriy.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFleGhqbnBza3BydHZwcWJ4cml5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzMzExMjEsImV4cCI6MjEwMTkwNzEyMX0.sMiJ1m8BptiVgCjK43-3cXNLzDto49T8vsNt3ulDNmU";
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById("lookupForm");
    const button = document.getElementById("lookupButton");
    const message = document.getElementById("message");
    const resultCard = document.getElementById("resultCard");

    function formatDate(value){
      if(!value) return "—";
      const [y,m,d] = String(value).split("-");
      return `${y}/${m}/${d}`;
    }

    function formatTime(value){
      return value ? String(value).slice(0,5) : "";
    }

    function formatDateTime(value){
      if(!value) return "—";
      return new Intl.DateTimeFormat("zh-TW", {
        year:"numeric",
        month:"2-digit",
        day:"2-digit",
        hour:"2-digit",
        minute:"2-digit"
      }).format(new Date(value));
    }

    function setMessage(text){
      message.textContent = text;
      message.className = text ? "message error" : "message";
    }

    function statusInfo(status){
      if(status === "confirmed"){
        return {text:"已確認", className:"status-badge"};
      }

      if(status === "pending"){
        return {text:"待付款", className:"status-badge pending"};
      }

      if(status === "waitlisted"){
        return {text:"備取中", className:"status-badge waitlisted"};
      }

      if(status === "cancelled"){
        return {text:"已取消", className:"status-badge cancelled"};
      }

      return {text:"目前狀態：" + (status || "未知"), className:"status-badge"};
    }

    function renderResult(data){
      const event = data.event || {};
      const status = statusInfo(data.status);

      const badge = document.getElementById("statusBadge");
      badge.textContent = status.text;
      badge.className = status.className;

      const statusNote = document.getElementById("statusNote");

      if(data.status === "pending"){
        statusNote.textContent =
          `付款提醒期限：${formatDateTime(data.payment_due_at)}
` +
          `若尚未完成付款，請依確認信中的付款資訊處理；如需確認付款或報名狀況，可與瑋瑋老師聯繫。`;
      }else if(data.status === "waitlisted"){
        statusNote.innerHTML =
          `目前為第 <strong>${data.waitlist_position || "—"}</strong> 組備取。` +
          `備取期間請先不要匯款；若有名額釋出，會由瑋瑋老師人工判斷是否轉為正取。` +
          `<br><a href="mailto:wesker.hung@outlook.com">與瑋瑋老師聯繫</a>`;
      }else if(data.status === "confirmed"){
        statusNote.textContent = "這筆報名目前已完成確認。";
      }else if(data.status === "cancelled"){
        statusNote.textContent = "這筆報名目前已取消，不再占用活動名額。";
      }else{
        statusNote.textContent = "";
      }

      document.getElementById("eventTitle").textContent = event.title || "活動";
      document.getElementById("eventDate").textContent = formatDate(event.event_date);

      const start = formatTime(event.start_time);
      const end = formatTime(event.end_time);
      document.getElementById("eventTime").textContent =
        start && end ? `${start}–${end}` : (start || end || "—");

      document.getElementById("eventLocation").textContent = event.location || "—";
      document.getElementById("quantity").textContent = `${data.quantity ?? 0} 人`;
      document.getElementById("contactName").textContent = data.contact_name || "—";
      document.getElementById("publicReference").textContent = data.public_reference || "—";

      const participants = document.getElementById("participants");
      participants.innerHTML = "";

      for(const participant of data.participants || []){
        const item = document.createElement("div");
        item.className = "participant";
        item.textContent = participant.name || "未提供";
        participants.appendChild(item);
      }

      if(!participants.children.length){
        const item = document.createElement("div");
        item.className = "participant";
        item.textContent = "無參加者資料";
        participants.appendChild(item);
      }

      const noteSection = document.getElementById("noteSection");
      const note = document.getElementById("note");

      if(data.note){
        note.textContent = data.note;
        noteSection.hidden = false;
      }else{
        note.textContent = "";
        noteSection.hidden = true;
      }

      form.style.display = "none";
      resultCard.classList.add("show");
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      setMessage("");
      resultCard.classList.remove("show");

      const reference = document.getElementById("reference").value.trim();
      const email = document.getElementById("email").value.trim();

      button.disabled = true;
      button.textContent = "查詢中…";

      const {data, error} = await client.rpc("lookup_registration", {
        p_public_reference: reference,
        p_email: email
      });

      button.disabled = false;
      button.textContent = "查詢報名";

      if(error){
        console.error(error);
        setMessage("查詢失敗，請稍後再試。");
        return;
      }

      if(!data){
        setMessage("查無符合的報名資料。請確認報名編號與 E-mail 是否與報名時填寫的資料完全一致。");
        return;
      }

      renderResult(data);
    });

    document.getElementById("searchAgainButton").addEventListener("click", () => {
      resultCard.classList.remove("show");
      form.style.display = "grid";
      setMessage("");
      document.getElementById("reference").focus();
    });
  </script>
</body>
</html>
